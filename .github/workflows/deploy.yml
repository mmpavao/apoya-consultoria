# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOY — Cloudflare Workers + Supabase Edge Functions
#
# PROTOCOLO STAGING-FIRST (implementado após incidente 2026-06-11):
#
#   push na main              →  SOMENTE staging
#                                (apoya-gestao-staging + apoya-mcp-staging)
#
#   tag semântica v*.*.*      →  PRODUÇÃO
#   (ex: git tag v1.2.3)         (apoya-gestao + apoya-mcp)
#
#   workflow_dispatch manual  →  escolha: staging OU produção
#
# NUNCA deploy automático de produção em push na main.
#
# SECRETS OBRIGATÓRIOS (GitHub → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN          Workers:Edit scope
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_PUBLISHABLE_KEY anon key — injetada no BUILD Vite (causa do incidente)
#   VITE_SUPABASE_URL
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_ACCESS_TOKEN         para Supabase CLI (Edge Functions)
#   ASAAS_API_KEY / FOCUSNFE_API_TOKEN / EVOLUTION_API_KEY / EVOLUTION_API_URL
#   PLUGGY_CLIENT_ID / PLUGGY_CLIENT_SECRET / PLUGGY_WEBHOOK_SECRET
#   APOYA_INTERNAL_SECRET
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy — Cloudflare Workers + Supabase Edge Functions

on:
  push:
    branches: [main]        # → staging
    tags: ['v*.*.*']        # → produção
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ── Resolver ambiente alvo ─────────────────────────────────────────────────
  resolve-env:
    name: Resolver ambiente
    runs-on: ubuntu-latest
    outputs:
      target:        ${{ steps.set.outputs.target }}
      worker_gestao: ${{ steps.set.outputs.worker_gestao }}
      worker_mcp:    ${{ steps.set.outputs.worker_mcp }}
    steps:
      - name: Determinar ambiente
        id: set
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET="production"
          else
            TARGET="staging"
          fi

          if [ "$TARGET" = "production" ]; then
            WORKER_GESTAO="apoya-gestao"
            WORKER_MCP="apoya-mcp"
          else
            WORKER_GESTAO="apoya-gestao-staging"
            WORKER_MCP="apoya-mcp-staging"
          fi

          echo "target=$TARGET"                 >> "$GITHUB_OUTPUT"
          echo "worker_gestao=$WORKER_GESTAO"   >> "$GITHUB_OUTPUT"
          echo "worker_mcp=$WORKER_MCP"         >> "$GITHUB_OUTPUT"

          echo "🎯 Ambiente: $TARGET"
          echo "   apoya-gestao → $WORKER_GESTAO"
          echo "   apoya-mcp    → $WORKER_MCP"
          echo "   Trigger: ${{ github.event_name }} / ref: ${{ github.ref }}"

  # ── apoya-gestao ───────────────────────────────────────────────────────────
  deploy-gestao:
    name: apoya-gestao → ${{ needs.resolve-env.outputs.worker_gestao }}
    needs: resolve-env
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Gate de testes — barra o deploy se algo quebrar ──────────────────
      - name: Testes (Vitest)
        run: npm test

      # ── Build Vite — VITE_ vars substituídas aqui em compile time ─────────
      # CRÍTICO: sem estas env vars no build, import.meta.env.VITE_* = undefined
      # no bundle do browser → crash de boot (causa do incidente 2026-06-11).
      # Carimbo de versão: versão = tag (ou main-<sha>), data/hora = momento do deploy
      - name: Carimbo de versão
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VITE_APP_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "VITE_APP_VERSION=main-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_ENV"
          fi
          echo "VITE_APP_BUILD_TS=$(TZ=America/Sao_Paulo date '+%Y-%m-%dT%H:%M:%S')" >> "$GITHUB_ENV"

      - name: Build (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL:             ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION:              ${{ env.VITE_APP_VERSION }}
          VITE_APP_BUILD_TS:             ${{ env.VITE_APP_BUILD_TS }}

      # ── Ajustar wrangler.json gerado pelo build ────────────────────────────
      - name: Configurar wrangler (${{ needs.resolve-env.outputs.worker_gestao }})
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          worker = os.environ["WORKER_NAME"]
          path   = "dist/server/wrangler.json"
          try:
              cfg = json.load(open(path))
          except FileNotFoundError:
              print(f"ERRO: {path} não encontrado", file=sys.stderr); sys.exit(1)
          cfg["name"]   = worker
          cfg["assets"] = {"directory": "../client", "binding": "ASSETS", "not_found_handling": "none"}
          if "staging" in worker:
              cfg.setdefault("vars", {})["WORKER_ENV"] = "staging"
          json.dump(cfg, open(path, "w"), indent=2)
          print(f"✅ wrangler.json: name={worker}")
          PYEOF
        env:
          WORKER_NAME: ${{ needs.resolve-env.outputs.worker_gestao }}

      - name: Deploy → ${{ needs.resolve-env.outputs.worker_gestao }}
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Injetar secrets runtime
        run: |
          W="${{ needs.resolve-env.outputs.worker_gestao }}"
          echo "Injetando secrets em: $W"
          _s() { echo "$2" | npx wrangler secret put "$1" --name "$W"; }

          _s SUPABASE_URL                  "${{ secrets.SUPABASE_URL }}"
          _s SUPABASE_SERVICE_ROLE_KEY     "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          _s VITE_SUPABASE_URL             "${{ secrets.VITE_SUPABASE_URL }}"
          _s VITE_SUPABASE_PUBLISHABLE_KEY "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
          _s SUPABASE_PUBLISHABLE_KEY      "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
          _s ASAAS_API_KEY                 "${{ secrets.ASAAS_API_KEY }}"
          _s FOCUSNFE_API_TOKEN            "${{ secrets.FOCUSNFE_API_TOKEN }}"
          _s EVOLUTION_API_KEY             "${{ secrets.EVOLUTION_API_KEY }}"
          _s EVOLUTION_API_URL             "${{ secrets.EVOLUTION_API_URL }}"
          _s PLUGGY_CLIENT_ID              "${{ secrets.PLUGGY_CLIENT_ID }}"
          _s PLUGGY_CLIENT_SECRET          "${{ secrets.PLUGGY_CLIENT_SECRET }}"
          _s PLUGGY_WEBHOOK_SECRET         "${{ secrets.PLUGGY_WEBHOOK_SECRET }}"
          _s APOYA_INTERNAL_SECRET         "${{ secrets.APOYA_INTERNAL_SECRET }}"
          _s APOYA_SERVICE_TOKEN           "${{ secrets.APOYA_SERVICE_TOKEN }}"
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Smoke test (${{ needs.resolve-env.outputs.worker_gestao }})
        run: |
          sleep 8
          URL="https://${{ needs.resolve-env.outputs.worker_gestao }}.talkzzbot.workers.dev/"
          HTTP=$(curl -s -o /tmp/smoke.html -w "%{http_code}" "$URL")
          TITLE=$(grep -o '<title>[^<]*</title>' /tmp/smoke.html | head -1 || echo "?")
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "301" ] || [ "$HTTP" = "302" ]; then
            echo "✅ Smoke OK: HTTP $HTTP — $TITLE"
          else
            echo "❌ Smoke FALHOU: HTTP $HTTP"
            head -c 500 /tmp/smoke.html
            exit 1
          fi

      # Edge Functions — apenas em produção
      - name: Setup Supabase CLI
        if: needs.resolve-env.outputs.target == 'production'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions (produção)
        if: needs.resolve-env.outputs.target == 'production'
        run: |
          supabase functions deploy nfse-pos-pagamento  --project-ref ajaqbdsalxfgrwpjbtbn
          supabase functions deploy sync-nfse-nfeio      --project-ref ajaqbdsalxfgrwpjbtbn
          # Time de agentes (reconciliado no repo — fonte de verdade)
          supabase functions deploy agente-fiscal        --project-ref ajaqbdsalxfgrwpjbtbn
          supabase functions deploy agente-rh            --project-ref ajaqbdsalxfgrwpjbtbn
          supabase functions deploy agente-financeiro    --project-ref ajaqbdsalxfgrwpjbtbn
          supabase functions deploy agente-contabil      --project-ref ajaqbdsalxfgrwpjbtbn
          supabase functions deploy agente-societario    --project-ref ajaqbdsalxfgrwpjbtbn
          supabase functions deploy agente-tabelas-tributarias --project-ref ajaqbdsalxfgrwpjbtbn
          supabase functions deploy agente-orquestrador  --project-ref ajaqbdsalxfgrwpjbtbn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

  # ── apoya-mcp ──────────────────────────────────────────────────────────────
  deploy-mcp:
    name: apoya-mcp → ${{ needs.resolve-env.outputs.worker_mcp }}
    needs: resolve-env
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Bundle apoya-mcp (esbuild → service-worker format)
        working-directory: workers/apoya-mcp
        run: |
          mkdir -p dist
          esbuild src/index.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2022 \
            --outfile=dist/bundle.js

          # Converter para service worker format via Node.js (sem heredoc Python)
          node -e "
          const fs = require('fs');
          let c = fs.readFileSync('dist/bundle.js', 'utf8');
          c = c.replace(/^export \{\s*\n?\s*index_default as default\s*\n?\s*\};?\s*\$/m, '');
          c = c.replace(/^export \{ index_default as default \};?\s*\$/m, '').trim();
          c += '\n\naddEventListener(\"fetch\", (event) => {\n  event.respondWith(index_default.fetch(event.request, globalThis));\n});\n';
          fs.writeFileSync('dist/bundle-sw.js', c);
          const tools = [...new Set((c.match(/name:\s*[\"']([\\w_]+)[\"']\s*,\s*description/g) || []).map(t => t.match(/[\"']([\\w_]+)[\"']/)[1]))];
          console.log('Bundle OK: ' + tools.length + ' tools, ' + c.length + ' bytes');
          "

      - name: Deploy apoya-mcp → ${{ needs.resolve-env.outputs.worker_mcp }}
        working-directory: workers/apoya-mcp
        run: |
          if [ "${{ needs.resolve-env.outputs.target }}" = "production" ]; then
            TOML="wrangler.toml"
          else
            TOML="wrangler-staging.toml"
          fi
          echo "Deploy via $TOML → ${{ needs.resolve-env.outputs.worker_mcp }}"

          # wrangler deploy usando o toml correto
          npx wrangler deploy \
            --config "$TOML" \
            --compatibility-date "2024-01-01"
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test (${{ needs.resolve-env.outputs.worker_mcp }})
        run: |
          sleep 8
          URL="https://${{ needs.resolve-env.outputs.worker_mcp }}.talkzzbot.workers.dev/health"
          HTTP=$(curl -s -o /tmp/mcp_health.json -w "%{http_code}" "$URL")
          if [ "$HTTP" != "200" ]; then
            echo "❌ MCP smoke FALHOU: HTTP $HTTP"
            cat /tmp/mcp_health.json; exit 1
          fi
          python3 -c "
          import json
          d = json.load(open('/tmp/mcp_health.json'))
          print(f'✅ MCP smoke OK: tools={d.get(\"tools\",\"?\")} version={d.get(\"version\",\"?\")} env={d.get(\"env\",\"?\")}')
          "
