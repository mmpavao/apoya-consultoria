# DEPLOY — Cloudflare Worker apoya-gestao + send-invite (modo manual)
#
#   push main     → staging (apoya-gestao-staging)
#   tag v*.*.*    → produção (apoya-gestao + send-invite)
#
# SECRETS: CLOUDFLARE_*, VITE_SUPABASE_*, SUPABASE_*, SUPABASE_ACCESS_TOKEN

name: Deploy — Cloudflare Workers + Supabase Edge Functions

on:
  push:
    branches: [main]        # → staging
    tags: ['v*.*.*']        # → produção
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ── Resolver ambiente alvo ─────────────────────────────────────────────────
  resolve-env:
    name: Resolver ambiente
    runs-on: ubuntu-latest
    outputs:
      target:        ${{ steps.set.outputs.target }}
      worker_gestao: ${{ steps.set.outputs.worker_gestao }}
    steps:
      - name: Determinar ambiente
        id: set
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET="production"
          else
            TARGET="staging"
          fi

          if [ "$TARGET" = "production" ]; then
            WORKER_GESTAO="apoya-gestao"
          else
            WORKER_GESTAO="apoya-gestao-staging"
          fi

          echo "target=$TARGET"                 >> "$GITHUB_OUTPUT"
          echo "worker_gestao=$WORKER_GESTAO"   >> "$GITHUB_OUTPUT"

          echo "🎯 Ambiente: $TARGET → $WORKER_GESTAO"

  # ── apoya-gestao ───────────────────────────────────────────────────────────
  deploy-gestao:
    name: apoya-gestao → ${{ needs.resolve-env.outputs.worker_gestao }}
    needs: resolve-env
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Gate de testes — barra o deploy se algo quebrar ──────────────────
      - name: Testes (Vitest)
        run: npm test

      # ── Build Vite — VITE_ vars substituídas aqui em compile time ─────────
      # CRÍTICO: sem estas env vars no build, import.meta.env.VITE_* = undefined
      # no bundle do browser → crash de boot (causa do incidente 2026-06-11).
      # Carimbo de versão: versão = tag (ou main-<sha>), data/hora = momento do deploy
      - name: Carimbo de versão
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VITE_APP_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "VITE_APP_VERSION=main-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_ENV"
          fi
          echo "VITE_APP_BUILD_TS=$(TZ=America/Sao_Paulo date '+%Y-%m-%dT%H:%M:%S')" >> "$GITHUB_ENV"

      - name: Build (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL:             ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION:              ${{ env.VITE_APP_VERSION }}
          VITE_APP_BUILD_TS:             ${{ env.VITE_APP_BUILD_TS }}

      # ── Ajustar wrangler.json gerado pelo build ────────────────────────────
      - name: Configurar wrangler (${{ needs.resolve-env.outputs.worker_gestao }})
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          worker = os.environ["WORKER_NAME"]
          path   = "dist/server/wrangler.json"
          try:
              cfg = json.load(open(path))
          except FileNotFoundError:
              print(f"ERRO: {path} não encontrado", file=sys.stderr); sys.exit(1)
          cfg["name"]   = worker
          cfg["assets"] = {"directory": "../client", "binding": "ASSETS", "not_found_handling": "none"}
          if "staging" in worker:
              cfg.setdefault("vars", {})["WORKER_ENV"] = "staging"
          json.dump(cfg, open(path, "w"), indent=2)
          print(f"✅ wrangler.json: name={worker}")
          PYEOF
        env:
          WORKER_NAME: ${{ needs.resolve-env.outputs.worker_gestao }}

      - name: Deploy → ${{ needs.resolve-env.outputs.worker_gestao }}
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Injetar secrets runtime
        run: |
          W="${{ needs.resolve-env.outputs.worker_gestao }}"
          echo "Injetando secrets em: $W"
          _s() { echo "$2" | npx wrangler secret put "$1" --name "$W"; }

          _s SUPABASE_URL                  "${{ secrets.SUPABASE_URL }}"
          _s SUPABASE_SERVICE_ROLE_KEY     "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          _s VITE_SUPABASE_URL             "${{ secrets.VITE_SUPABASE_URL }}"
          _s VITE_SUPABASE_PUBLISHABLE_KEY "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
          _s SUPABASE_PUBLISHABLE_KEY      "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Smoke test (${{ needs.resolve-env.outputs.worker_gestao }})
        run: |
          sleep 8
          URL="https://${{ needs.resolve-env.outputs.worker_gestao }}.talkzzbot.workers.dev/"
          HTTP=$(curl -s -o /tmp/smoke.html -w "%{http_code}" "$URL")
          TITLE=$(grep -o '<title>[^<]*</title>' /tmp/smoke.html | head -1 || echo "?")
          if [ "$HTTP" = "200" ] || [ "$HTTP" = "301" ] || [ "$HTTP" = "302" ]; then
            echo "✅ Smoke OK: HTTP $HTTP — $TITLE"
          else
            echo "❌ Smoke FALHOU: HTTP $HTTP"
            head -c 500 /tmp/smoke.html
            exit 1
          fi

      # Edge Functions — apenas em produção
      - name: Setup Supabase CLI
        if: needs.resolve-env.outputs.target == 'production'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions (produção)
        if: needs.resolve-env.outputs.target == 'production'
        # Deploya TODAS as funções; se QUALQUER uma falhar, o job falha no fim
        # (antes era continue-on-error: falha de deploy passava como verde e o
        # fix nunca chegava em prod — achado da re-auditoria).
        run: |
          set +e
          fail=0
          for fn in send-invite; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref ajaqbdsalxfgrwpjbtbn || { echo "❌ falhou: $fn"; fail=1; }
            echo "::endgroup::"
          done
          [ "$fail" = "0" ] && echo "✅ todas as functions deployadas" || echo "❌ uma ou mais functions falharam"
          exit $fail
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
